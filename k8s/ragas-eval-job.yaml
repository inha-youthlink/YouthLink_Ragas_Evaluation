# RAGAS 평가를 실행하는 K8s Job (generate는 로컬 실행)
#
# 사전 준비 (값은 직접 넣는다. 파일에 적지 않는다)
#   kubectl create secret generic ragas-eval-secrets \
#     --from-literal=OPENAI_API_KEY='...' \
#     --from-literal=DATABASE_URL='postgresql://user:pass@host:5432/youthlink'
#
# 실행 / 재실행 (Job은 이름이 같으면 재생성해야 한다)
#   kubectl delete job ragas-eval --ignore-not-found
#   kubectl apply -f k8s/ragas-eval-job.yaml
#   kubectl logs -f job/ragas-eval
apiVersion: v1
kind: ConfigMap
metadata:
  name: ragas-eval-config
  labels:
    app: ragas-eval
data:
  # rag 모드/route가 호출하는 RAG Service 주소 (클러스터 Service 이름에 맞게 수정)
  RAG_BASE_URL: "http://youthlink-rag:8000"
  GEN_MODEL: "bedrock-gpt-5.6-luna"
  JUDGE_MODEL: "bedrock-gpt-5.6-luna"
  EMBEDDING_MODEL: "bedrock-titan-embed-v2"
  # run --baseline 전용. RAG chat_model과 같게 둔다
  BASELINE_MODEL: "bedrock-gpt-5.6-luna"
  # 채점 LLM 동시 요청 상한. RAG와 같은 API 키(키당 동시 8)를 나눠 쓰므로 RAG 몫 4를 남긴다
  LLM_MAX_CONCURRENCY: "4"
  # bedrock-* 모델은 OpenAI 호환 프록시로 호출하므로 프록시 주소가 필요하다. 없으면 OpenAI 기본 주소로 가서 실패한다
  # OPENAI_BASE_URL: "<프록시 주소>"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ragas-eval
  labels:
    app: ragas-eval
spec:
  backoffLimit: 0
  # offline 100건이 RAG 없이 약 33분. rag 모드는 RAG 호출이 더해지고 동시 요청이 4라 1시간을 넘을 수 있다
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app: ragas-eval
    spec:
      restartPolicy: Never
      containers:
        - name: ragas-eval
          # ECR 주소는 계정에 맞게 교체 (prefix youthlink/*)
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/youthlink/ragas-eval:latest
          # 기본: 답변 품질 평가. 다른 실행은 아래 args 예시로 교체
          #   args: ["route", "--routing", "datasets/routing_v1.jsonl"]
          #   args: ["run", "--golden", "datasets/golden_v2.jsonl", "--baseline"]
          args: ["run", "--golden", "datasets/golden_v2.jsonl"]
          envFrom:
            - configMapRef:
                name: ragas-eval-config
            - secretRef:
                name: ragas-eval-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
