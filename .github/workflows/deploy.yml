# 평가 이미지를 빌드해 ECR(youthlink/ragas-eval)에 push
name: deploy

# 이미지에 들어가는 파일이 main에 바뀌거나 수동 실행할 때
on:
  push:
    branches: [main]
    paths:
      - "ragas_eval/**"
      - "datasets/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
  workflow_dispatch:

# OIDC로 AWS Role을 받기 위한 권한
permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 저장소 코드 받기
      - uses: actions/checkout@v4

      # GitHub OIDC로 push 권한 Role 받기
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # ECR 로그인
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 이미지 빌드 후 커밋 SHA·latest 태그로 push
      - env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/youthlink/ragas-eval
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"
